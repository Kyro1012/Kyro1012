  </text>

  <line x1="75" y1="533"
        x2="1325" y2="533"
        stroke="#222829"/>

  <text x="75" y="575"
        fill="#E1E5E3"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="20">
    ValkOS
  </text>

  <text x="300" y="575"
        fill="#89918E"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="18">
    Linux distribution development
  </text>

  <text x="75" y="615"
        fill="#E1E5E3"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="20">
    Game Development
  </text>

  <text x="300" y="615"
        fill="#89918E"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="18">
    Systemic gameplay · AI · World Systems
  </text>

  <text x="75" y="655"
        fill="#E1E5E3"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="20">
    Aberration
  </text>

  <text x="300" y="655"
        fill="#89918E"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="18">
    Speculative fiction · Worldbuilding
  </text>

</svg>
