<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="300"
     viewBox="0 0 1400 300">

  <rect width="1400" height="300" fill="#090B0C"/>

  <!-- Continuous outer frame -->
  <path d="M2 0V288C2 293.523 6.477 298 12 298H1388C1393.523 298 1398 293.523 1398 288V0"
        fill="none"
        stroke="#2A3031"
        stroke-width="2"/>


  <!-- STATUS -->

  <rect x="50" y="30"
        width="1300"
        height="105"
        rx="7"
        fill="#0C0F10"
        stroke="#2A3031"/>

  <text x="75" y="70"
        fill="#7CFFB2"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="25"
        font-weight="600">
    ~/status
  </text>

  <line x1="75" y1="88"
        x2="1325" y2="88"
        stroke="#222829"/>

  <circle cx="80" cy="113" r="5"
          fill="#7CFFB2">
    <animate attributeName="opacity"
             values="1;0.3;1"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="98" y="120"
        fill="#7CFFB2"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="18">
    ONLINE
  </text>


  <!-- Future expansion area -->

  <rect x="50" y="160"
        width="1300"
        height="95"
        rx="7"
        fill="#0C0F10"
        stroke="#2A3031"/>

  <text x="75" y="200"
        fill="#7CFFB2"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="25"
        font-weight="600">
    ~/current
  </text>

  <text x="300" y="200"
        fill="#59615F"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="18">
    initializing...
  </text>

  <text x="75" y="235"
        fill="#59615F"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="16">
    reserved for current / favourite projects
  </text>


  <!-- Terminal prompt -->

  <text x="75" y="285"
        fill="#89918E"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="17">
    kyro@bazzite:~$
  </text>

  <rect x="215" y="267"
        width="11"
        height="22"
        rx="1"
        fill="#7CFFB2">

    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.05s"
             repeatCount="indefinite"/>

  </rect>

</svg>
