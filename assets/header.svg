<svg width="1400" height="1250" viewBox="0 0 1400 1250" fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1400" y2="1250"
                gradientUnits="userSpaceOnUse">
  <stop stop-color="#0A0C0D"/>
  <stop offset="1" stop-color="#101416"/>
</linearGradient>

<!-- Subtle glow -->
<filter id="softGlow">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .mono {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code",
                 "DejaVu Sans Mono", monospace;
  }

  .title {
    fill: #F2F4F3;
    font-family: "JetBrains Mono", "Fira Code",
                 "DejaVu Sans Mono", monospace;
    font-weight: 600;
  }

  .primary {
    fill: #E2E6E4;
  }

  .secondary {
    fill: #8A9290;
  }

  .muted {
    fill: #5F6865;
  }

  .accent {
    fill: #7CFFB2;
  }

  .accentStroke {
    stroke: #7CFFB2;
  }

  .border {
    stroke: #292F30;
  }
</style>

<!-- Cursor -->
<rect id="cursor"
      x="0" y="0"
      width="10" height="21"
      rx="1"
      fill="#7CFFB2">
  <animate
    attributeName="opacity"
    values="1;0;1"
    dur="1.1s"
    repeatCount="indefinite"/>
</rect>
```

