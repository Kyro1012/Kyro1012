<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="435"
     viewBox="0 0 1400 435">

  <!-- ====================================================== -->
  <!-- TITLE BAR                                               -->
  <!-- ====================================================== -->

  <rect x="2" y="2"
        width="1396"
        height="64"
        rx="12"
        fill="#0E1112"/>

  <line x1="2" y1="64"
        x2="1398" y2="64"
        stroke="#2A3031"/>

  <circle cx="30" cy="33" r="6" fill="#353B3C"/>
  <circle cx="52" cy="33" r="6" fill="#353B3C"/>
  <circle cx="74" cy="33" r="6" fill="#353B3C"/>

  <text x="700" y="41"
        text-anchor="middle"
        fill="#9AA29F"
        font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace"
        font-size="20">
    kyro@bazzite: ~
  </text>


  <!-- ====================================================== -->
  <!-- ONLINE INDICATOR                                        -->
  <!-- ====================================================== -->

  <circle cx="1315" cy="33"
          r="5"
          fill="#7CFFB2">

    <animate attributeName="opacity"
             values="1;0.3;1"
             dur="2s"
             begin="-0.5s"
             repeatCount="indefinite"/>

  </circle>

  <text x="1332" y="40"
