<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0D0E"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace;
      }

      .primary {
        fill: #E6E6E6;
      }

      .secondary {
        fill: #858B91;
      }

      .accent {
        fill: #7CFFB2;
      }

      .line {
        stroke: #292D32;
        stroke-width: 1;
      }
    </style>

    <!-- Blinking cursor -->
    <g id="cursor">
      <rect x="0" y="0" width="9" height="18" rx="1" fill="#7CFFB2">
        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="1.1s"
          repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Pulsing status indicator -->
    <circle cx="0" cy="0" r="4" fill="#7CFFB2">
      <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>
  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND                                                -->
  <!-- ========================================================= -->

  <rect width="1200" height="340" rx="8" fill="url(#bg)"/>

  <!-- Terminal border -->
  <rect x="1" y="1" width="1198" height="338" rx="8"
        stroke="#292D32"
        stroke-width="1"
        fill="none"/>


  <!-- ========================================================= -->
  <!-- TERMINAL TITLE BAR                                        -->
  <!-- ========================================================= -->

  <line x1="1" y1="44" x2="1199" y2="44" class="line"/>

  <!-- Window controls -->
  <circle cx="23" cy="22" r="4" fill="#3A3F44"/>
  <circle cx="39" cy="22" r="4" fill="#3A3F44"/>
  <circle cx="55" cy="22" r="4" fill="#3A3F44"/>

  <!-- Terminal title -->
  <text x="600" y="27"
        text-anchor="middle"
        class="mono secondary"
        font-size="13">
    kyro@bazzite: ~
  </text>

  <!-- Online indicator -->
  <g transform="translate(1127 22)">
    <circle cx="0" cy="0" r="4" fill="#7CFFB2">
      <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <text x="12" y="5"
          class="mono secondary"
          font-size="11">
      ONLINE
    </text>
  </g>


  <!-- ========================================================= -->
  <!-- BOOT TEXT                                                 -->
  <!-- ========================================================= -->

  <text x="55" y="78"
        class="mono secondary"
        font-size="12">
    $ ./profile --initialize
  </text>

  <text x="55" y="101"
        class="mono secondary"
        font-size="11"
        opacity="0">

    [ OK ] developer environment

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;0.18;0.25"
      dur="3s"
      fill="freeze"/>
  </text>

  <text x="55" y="119"
        class="mono secondary"
        font-size="11"
        opacity="0">

    [ OK ] project registry

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;0.25;0.32"
      dur="3s"
      fill="freeze"/>
  </text>

  <text x="55" y="137"
        class="mono secondary"
        font-size="11"
        opacity="0">

    [ OK ] creative modules

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;0.32;0.39"
      dur="3s"
      fill="freeze"/>
  </text>


  <!-- ========================================================= -->
  <!-- MAIN IDENTITY                                             -->
  <!-- ========================================================= -->

  <text x="600" y="204"
        text-anchor="middle"
        class="mono primary"
        font-size="48"
        font-weight="600"
        letter-spacing="10"
        opacity="0">

    KYRO1012

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;0.42;0.55"
      dur="3s"
      fill="freeze"/>
  </text>


  <!-- Accent line -->

  <line x1="350" y1="221" x2="850" y2="221"
        stroke="#7CFFB2"
        stroke-width="1"
        opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;0.8"
      keyTimes="0;0.5;0.65"
      dur="3s"
      fill="freeze"/>

  </line>


  <!-- Subtitle -->

  <text x="600" y="249"
        text-anchor="middle"
        class="mono secondary"
        font-size="12"
        letter-spacing="2"
        opacity="0">

    GAME TECHNOLOGY  ·  LINUX  ·  SOFTWARE  ·  WORLDBUILDING

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;0.58;0.72"
      dur="3s"
      fill="freeze"/>
  </text>


  <!-- ========================================================= -->
  <!-- BOTTOM TERMINAL PROMPT                                    -->
  <!-- ========================================================= -->

  <line x1="55" y1="280" x2="1145" y2="280" class="line"/>

  <text x="55" y="308"
        class="mono secondary"
        font-size="12">
    kyro@bazzite:~$
  </text>

  <g transform="translate(177 293)">
    <rect width="9" height="18" rx="1" fill="#7CFFB2">
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1.1s"
        repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
